worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # ===== HTTP → HTTPS редирект для обоих доменов =====
    server {
        listen 80;
        server_name bipacman.duckdns.org rdgr.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # ===== САЙТ (bipacman.duckdns.org) =====
    server {
        listen 443 ssl;
        server_name bipacman.duckdns.org;

        # SSL сертификаты
        ssl_certificate     C:/certs/bipacman.duckdns.org-chain.pem;
        ssl_certificate_key C:/certs/bipacman.duckdns.org-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Логи
        access_log C:/site/logs/site_access.log;
        error_log  C:/site/logs/site_error.log;

        # API (FastAPI) - 300MB лимит
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Лимит размера загружаемых файлов - 300MB
            client_max_body_size 300M;
        }

        # Статический фронтенд
        location / {
            root C:/site/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ===== COMFYUI (rdgr.duckdns.org) - ОПТИМИЗИРОВАНО =====
    server {
        listen 443 ssl;
        server_name rdgr.duckdns.org;

        # SSL сертификаты
        ssl_certificate     C:/certs/rdgr.duckdns.org-chain.pem;
        ssl_certificate_key C:/certs/rdgr.duckdns.org-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Логи
        access_log C:/site/logs/comfy_access.log;
        error_log  C:/site/logs/comfy_error.log;

        # Проксирование на ComfyUI - ОПТИМИЗИРОВАНО
        location / {
            proxy_pass http://127.0.0.1:8188/;
            
            # Обязательные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket поддержка (КРИТИЧНО для ComfyUI!)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Отключаем буферизацию для WebSocket (УМЕНЬШАЕТ ЗАДЕРЖКИ!)
            proxy_buffering off;
            proxy_cache off;
            
            # Лимит размера загружаемых файлов - 300MB
            client_max_body_size 300M;
            
            # Разумные таймауты (вместо 0)
            proxy_read_timeout 3600s;      # 1 час для долгих генераций
            proxy_connect_timeout 60s;      # 1 минута на подключение
            proxy_send_timeout 3600s;       # 1 час на отправку
        }
    }
}